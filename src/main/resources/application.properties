spring.application.name=insighton-eureka

server.port=8761

# Eureka 서버 자기 자신을 다른 Eureka에 등록하지 않음 (본인이 서버니까 등록할 필요 없음)
eureka.client.register-with-eureka=false

# 다른 서비스 목록을 가져오지 않음 (역시 자기가 서버라서 불필요)
eureka.client.fetch-registry=false

# 이 두 개가 없으면, Eureka 서버 자신이 나도 Eureka 클라이언트 라고 자기 자신을 자기한테 등록하려듬
# Eureka 서버 전용 설정에서는 필수로 꺼두는게 옳음

# 개발/테스트 환경에서 꺼둠 켜져 있으면 네트워크가 불안정할 때 서비스 목록을 실제보다 더 오래 유지하려고 함
# 프로뎍션에선 커두는게 권장
eureka.server.enable-self-preservation=false
